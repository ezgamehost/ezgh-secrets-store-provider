# gitleaks: the default rules, less the synthetic credentials in the vendored kit's contract
# test vectors and tests (sequential bytes, documented example IDs). Values only, never paths:
# a real key anywhere still fails. Reviewed 2026-11-06.
[extend]
useDefault = true

